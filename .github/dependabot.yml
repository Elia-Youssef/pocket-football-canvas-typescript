# Weekly dependency and workflow updates. GITHUB section 12: a dependency pull
# request is an ordinary pull request. It merges when the gate is green, and
# never because it is only a version bump.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps
    groups:
      # One pull request for the toolchain rather than eight. The gate runs the
      # whole pipeline either way, so a grouped bump is cheaper to review and no
      # less safe.
      #
      # The name is short on purpose. Dependabot writes it into the commit
      # subject. The record check holds the hand-written subject to 72 ASCII
      # characters and accepts only GitHub's optional " (#N)" suffix beyond
      # that, so a descriptive group name is how that ceiling gets breached by
      # a commit nobody here wrote.
      #
      # MAJORS TRAVEL ALONE. The group carries minor and patch updates only, so
      # a major opens its own pull request and is reviewed on its own terms. The
      # principle was already written below for the compiler and implemented for
      # nothing else: the first grouped pull request this repository received
      # bundled a test-runner major that raises the Node floor above the version
      # both CI jobs pin with two ordinary patches, and its gate reported green,
      # so the only correct action on it was "do not merge" - which GITHUB
      # section 12 says a dependency pull request must never need.
      toolchain:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # A compiler major is a migration, not a bump: it changes what the type
      # checker accepts and it moves the floor typescript-eslint supports. It
      # is taken deliberately, in its own pull request, never grouped.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      # deps and not ci, because an action bump IS a dependency update and the
      # record check waives the Closes: line per COMMIT rather than per branch.
      # Under a ci: prefix the same commit would pass while its dependabot
      # branch existed and then fail the whole-history walk forever once it was
      # squash-merged onto main, which is a gate that expires. A human ci:
      # commit still owes its Closes: line.
      prefix: deps
