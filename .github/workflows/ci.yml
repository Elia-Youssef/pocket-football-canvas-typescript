# The merge gate. GITHUB sections 6 and 9.
#
# Two jobs, and the names below are load-bearing: `.github/rulesets/
# protect-main.json` lists them as required status check contexts character for
# character, so renaming a job here without renaming it there leaves `main`
# protected by a context GitHub will never see reported, which reads as a
# permanently pending check rather than as a failure.
#
# The policy job has no dependencies and finishes in seconds, so the gates job
# waits on it: a banned name in the record fails before anything is installed
# rather than after a five minute install.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The build is static, takes no secret and reads none. GITHUB section 10.
permissions:
  contents: read

# A superseded run on the same ref is wasted compute and a confusing status, so
# a pull request cancels its own predecessor.
#
# A PUSH GETS A GROUP OF ITS OWN, PER COMMIT. The ref is constant on the default
# branch, so a shared group makes every push contend with the one before it:
# three commits landed on 2026-09-07 with no completed run at all. GITHUB
# section 6 treats a required check that has not reported as a failure rather
# than a pass, and GITHUB section 7 closes the squash gap with the push-to-main
# run precisely because it is the first thing to read the composed message. A
# cancelled run reads neither.
#
# `cancel-in-progress: false` alone is NOT enough, and that is why the group
# carries the commit. Within one concurrency group a run that arrives while
# another is in progress becomes PENDING, and a pending run is cancelled by the
# next one to arrive whatever cancel-in-progress says: on a burst of three
# pushes the middle commit still ends with no conclusion. Keying the group on
# github.sha puts every default-branch commit in a group of one, so nothing it
# can contend with exists. Every other event keeps the shared group and the
# cancellation, so a pull request still supersedes itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth 0 because the record check walks the complete ancestry of
      # the checked-out revision, not only the diff. A shallow checkout would be
      # refused by name rather than judged on a partial walk.
      #
      # NO `ref:` OVERRIDE, SO BOTH JOBS JUDGE ONE TREE. With one, this job read
      # the pull request head while the gates job below built the merge ref, and
      # the two checks could report on two different trees. The merge ref's walk
      # covers `main`'s already clean history plus this pull request's own
      # commits, which is a SUPERSET of what the head walk saw and never a
      # smaller set, and the branch name still reaches the check through
      # REPOSITORY_BRANCH rather than through the checkout. The one commit the
      # merge ref adds is the synthetic merge itself, which the record walk
      # skips today only because it walks --no-merges.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # No cache and no install: the check runs on node builtins alone, which
      # is what lets it be the job everything else depends on.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0

      - name: Branches, commits, identities and file content
        run: node scripts/check-repository-record.mjs
        env:
          REPOSITORY_BRANCH: ${{ github.head_ref || github.ref_name }}
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
          PULL_REQUEST_BODY: ${{ github.event.pull_request.body }}
          PULL_REQUEST_AUTHOR: ${{ github.event.pull_request.user.login }}

  pocket-football:
    name: Pocket Football gates
    needs: repository-policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          cache: npm

      # npm ci and nothing else: it fails outright if package.json and the
      # lockfile disagree, which is why it is the documented command.
      - name: Install from the lockfile
        run: npm ci

      # The browser gate needs its engines present. Playwright's webkit is a
      # WebKit build and not Safari: QUALITY-BAR section 2 keeps real Safari,
      # iOS and Android on the release gate, and nothing here claims otherwise.
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Type check
        run: npm run typecheck

      - name: Lint, including the core boundary
        run: npm run lint

      - name: Unit and headless tests
        run: npm run test

      # THE BROWSER PHASE CARRIES ITS OWN BUDGET, so a slow suite reports as a
      # slow suite rather than as a killed job. Without it the only bound is the
      # job cap above, and this one step is 94.0 percent of the job: measured at
      # 19 m 08 s of a 20 m 21 s job on 2026-09-07 (354 tests, three engines),
      # against local full runs of 13.7 to 22.0 minutes. Twenty-five minutes is
      # that measurement plus a 31 percent margin, and it clears the widest
      # local run. The job cap stays at 30, which the 25 here plus everything
      # else that run spent leaves headroom inside: 20 m 21 s of job less
      # 19 m 08 s of browser step is 73 seconds for the whole of the rest, the
      # runner's own set-up included.
      - name: Browser tests
        timeout-minutes: 25
        run: npm run test:browser

      - name: Deterministic build
        run: npm run verify:build

      - name: Upload the browser report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
